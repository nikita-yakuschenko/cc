services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3330
      DATABASE_URL: ${DATABASE_URL}
      APP_URL: ${APP_URL}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      AUTH_SECRET: ${AUTH_SECRET}
      IP_HASH_SALT: ${IP_HASH_SALT}
    expose:
      - "3330"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:3330/api/health",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
