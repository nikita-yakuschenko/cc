services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: "${NEXT_PUBLIC_APP_URL:-https://go.avgst.ru}"
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      APP_URL: ${APP_URL}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      AUTH_SECRET: ${AUTH_SECRET}
      IP_HASH_SALT: ${IP_HASH_SALT}
      BITRIX_PORTAL_URL: ${BITRIX_PORTAL_URL}
      BITRIX_CLIENT_ID: ${BITRIX_CLIENT_ID}
      BITRIX_CLIENT_SECRET: ${BITRIX_CLIENT_SECRET}
      BITRIX_ADMIN_EMAILS: ${BITRIX_ADMIN_EMAILS:-}
    expose:
      - "3330"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:3330/api/health",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
